<text x="30.0" y="876.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#666">Supervised readout is fit on the cell-line cohort, frozen, then applied to held-out test deltas -- train and test viability are different screens on different samples.</text>
<text x="30.0" y="892.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#666">All delta on log-CPM fold-change; each gene z-scored per cohort before the readout.  Purple = the readout (fit -&gt; frozen -&gt; applied).  Amber = FM under test.  Dashed = labels / controls.</text>
